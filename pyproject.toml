[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "climate-fairness-audit"
version = "0.1.0"
description = "Audit who gets 'seen' by climate models: data-visibility and fairness analysis across Indian districts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GARV" }]
keywords = ["climate", "fairness", "air-quality", "geospatial", "responsible-ai", "india"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "pandera>=0.20",
]

[project.optional-dependencies]
fairness = ["fairlearn>=0.10"]
geo = ["geopandas>=0.14", "shapely>=2.0", "rasterio>=1.3", "xarray>=2024.1"]
ml = ["scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45", "mlflow>=2.10"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pre-commit>=3.7", "pip-audit>=2.7", "bandit>=1.7", "geopandas>=0.14", "shapely>=2.0"]

[project.scripts]
cfa = "cfa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
